<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>認証</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
  }
  .card {
    width: 100%;
    max-width: 380px;
    padding: 2.5rem 2rem;
    background: #1e293b;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 1.5rem;
    text-align: center;
    font-weight: 600;
  }
  input[type="password"] {
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    outline: none;
    margin-bottom: 1rem;
  }
  input[type="password"]:focus {
    border-color: #38bdf8;
  }
  button {
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #38bdf8;
    color: #0f172a;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover {
    background: #0ea5e9;
  }
  .message {
    margin-top: 1rem;
    font-size: 0.9rem;
    min-height: 1.2rem;
    text-align: center;
  }
  .message.error {
    color: #f87171;
  }
  .message.checking {
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>パスフレーズを入力してください</h1>
    <form id="authForm" autocomplete="off">
      <input type="password" id="passphrase" placeholder="パスフレーズ" required autofocus>
      <button type="submit">送信</button>
      <div id="message" class="message"></div>
    </form>
  </div>

<script>
  // SHA-256(pass-phrase)。
  const CORRECT_HASH = "3b700abfb2f531dde166335e2a138bdb4841c32299168956a8dcb071dfee62d9";
  // Redirect to
  const _r = "Y3liZXJkZWZlbnNlX2RlbW9fc2luc2UyMDI2MDkuaHRtbA==";
  const REDIRECT_TARGET = atob(_r);

  async function sha256Hex(text) {
    const enc = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(digest))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  const form = document.getElementById("authForm");
  const input = document.getElementById("passphrase");
  const message = document.getElementById("message");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    message.textContent = "確認中...";
    message.className = "message checking";

    const value = input.value;
    const hash = await sha256Hex(value);

    if (hash === CORRECT_HASH) {
      message.textContent = "認証に成功しました。移動します...";
      message.className = "message";
      window.location.href = REDIRECT_TARGET;
    } else {
      message.textContent = "パスフレーズが正しくありません。もう一度入力してください。";
      message.className = "message error";
      input.value = "";
      input.focus();
    }
  });
</script>
</body>
</html>
