<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>謎解き:その写真、本当に開いて大丈夫?</title>
<style>
  :root{
    --chrome-bg: #f3f3f3;
    --win-bg: #ffffff;
    --border: #e1e1e1;
    --border-strong: #c9c9c9;
    --ink: #1b1b1b;
    --muted: #5b5b5b;
    --accent: #0067c0;
    --accent-dark: #004f99;
    --danger: #b3261e;
    --danger-bg: #fdecea;
    --safe: #1e7145;
    --safe-bg: #e8f5ee;
    --warn: #8a5a00;
    --warn-bg: #fdf3dc;
    --mono: 'Consolas','SFMono-Regular','Cascadia Mono',monospace;
    --ui: 'Segoe UI','Yu Gothic UI','Meiryo',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--ui);
    background: linear-gradient(180deg,#e9edf2 0%,#dde3ea 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .stage{
    width:100%;
    max-width:720px;
  }
  .header{
    text-align:center;
    margin-bottom:20px;
  }
  .header h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:.02em;
  }
  .header p{
    margin:0;
    color:var(--muted);
    font-size:13.5px;
  }
  .steps{
    display:flex;
    justify-content:center;
    gap:6px;
    margin:18px 0 22px;
  }
  .steps .dot{
    width:28px;height:4px;border-radius:2px;
    background:var(--border-strong);
    transition:background .25s;
  }
  .steps .dot.active{background:var(--accent);}
  .steps .dot.done{background:var(--safe);}

  .window{
    background:var(--win-bg);
    border:1px solid var(--border-strong);
    border-radius:10px;
    box-shadow:0 18px 40px rgba(20,20,30,.14);
    overflow:hidden;
  }
  .titlebar{
    background:var(--chrome-bg);
    border-bottom:1px solid var(--border);
    padding:9px 14px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--muted);
  }
  .titlebar .dots{display:flex; gap:6px; margin-right:4px;}
  .titlebar .dots span{width:10px;height:10px;border-radius:50%;background:#d8d8d8;display:inline-block;}
  .panel{padding:22px 24px;}

  /* Screen A: mail */
  .mail-head{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:14px;
  }
  .mail-subject{font-size:16px; font-weight:600;}
  .mail-meta{font-size:12px; color:var(--muted);}
  .mail-from{font-size:13px; margin-bottom:14px;}
  .mail-from b{font-weight:600;}
  .mail-body{font-size:14px; line-height:1.8; margin-bottom:18px;}
  .attach{
    display:flex; align-items:center; gap:12px;
    border:1px solid var(--border); border-radius:8px;
    padding:10px 14px; width:fit-content;
    background:#fafafa;
    cursor:pointer;
    transition:box-shadow .15s, transform .15s;
  }
  .attach:hover{box-shadow:0 4px 10px rgba(0,0,0,.08); transform:translateY(-1px);}
  .attach-icon{
    width:34px;height:34px;border-radius:5px;
    background:linear-gradient(160deg,#7fb6ff,#4a8fe0);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:11px;font-weight:700;
  }
  .attach-name{font-size:13.5px; font-weight:600;}
  .attach-sub{font-size:11.5px; color:var(--muted);}

  /* Explorer list */
  .explorer-toolbar{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:0;
    font-size:12.5px; color:var(--muted);
  }
  .ext-toggle{
    display:flex; align-items:center; gap:6px; font-size:12px;
  }
  .ext-toggle input{width:14px;height:14px;}
  .file-row{
    display:flex; align-items:center; gap:12px;
    padding:14px 4px; border-bottom:1px solid #f0f0f0;
  }
  .file-icon{
    width:38px;height:38px;border-radius:5px;
    background:linear-gradient(160deg,#7fb6ff,#4a8fe0);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:10px;font-weight:700;
    flex-shrink:0;
  }
  .file-info{flex:1;}
  .file-name{font-size:13.5px; font-weight:600; font-family:var(--mono);}
  .file-cols{display:flex; gap:22px; font-size:11.5px; color:var(--muted); margin-top:3px;}
  .col-flag{color:var(--danger); font-weight:700;}

  .question{
    margin-top:18px;
    background:#f7f8fa;
    border:1px solid var(--border);
    border-radius:8px;
    padding:16px 18px;
  }
  .question h3{margin:0 0 10px; font-size:14px;}
  .opt{
    display:block; width:100%; text-align:left;
    padding:10px 12px; margin-bottom:8px;
    border:1px solid var(--border-strong); border-radius:7px;
    background:#fff; font-size:13.5px; font-family:var(--ui);
    cursor:pointer; color:var(--ink);
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--accent);}
  .opt.correct{background:var(--safe-bg); border-color:var(--safe); color:var(--safe);}
  .opt.wrong{background:var(--danger-bg); border-color:var(--danger); color:var(--danger);}
  .opt[disabled]{cursor:default;}

  .feedback{
    margin-top:12px; font-size:13px; line-height:1.7;
    padding:10px 12px; border-radius:7px;
  }
  .feedback.ok{background:var(--safe-bg); color:var(--safe);}
  .feedback.warn{background:var(--warn-bg); color:var(--warn);}

  .btn{
    display:inline-block;
    background:var(--accent); color:#fff; border:none;
    padding:10px 20px; border-radius:6px; font-size:13.5px; font-weight:600;
    cursor:pointer; font-family:var(--ui);
  }
  .btn:hover{background:var(--accent-dark);}
  .btn.secondary{background:#fff; color:var(--ink); border:1px solid var(--border-strong);}
  .btn.secondary:hover{background:#f2f2f2;}
  .btn-row{margin-top:18px; display:flex; gap:10px; justify-content:flex-end;}

  /* Properties dialog */
  .prop-tabs{display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:16px;}
  .prop-tab{padding:8px 14px; font-size:12.5px; color:var(--muted); border-bottom:2px solid transparent;}
  .prop-tab.active{color:var(--ink); border-color:var(--accent); font-weight:600;}
  .prop-row{display:flex; gap:12px; margin-bottom:12px; align-items:flex-start;}
  .prop-label{width:96px; flex-shrink:0; font-size:12.5px; color:var(--muted); padding-top:6px;}
  .prop-value{
    flex:1; font-family:var(--mono); font-size:12px;
    background:#f7f7f7; border:1px solid var(--border-strong);
    border-radius:5px; padding:8px 10px; word-break:break-all; line-height:1.6;
  }
  .prop-value.flagged{background:var(--danger-bg); border-color:var(--danger); color:var(--danger);}
  .callouts{margin-top:16px; display:flex; flex-direction:column; gap:8px;}
  .callout{
    display:flex; gap:10px; font-size:12.5px; line-height:1.6;
    background:#fff; border:1px solid var(--border); border-radius:7px; padding:10px 12px;
  }
  .callout .n{
    width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
    flex-shrink:0;
  }

  /* Infection sim (only if wrong path chosen) */
  .sim-screen{text-align:center; padding:40px 20px;}
  .sim-img{
    width:120px;height:90px;margin:0 auto 18px;
    background:repeating-linear-gradient(45deg,#ddd,#ddd 6px,#eee 6px,#eee 12px);
    border:1px solid var(--border-strong); border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    color:#999; font-size:11px;
  }
  .sim-console{
    background:#101418; color:#39d47a; font-family:var(--mono); font-size:12.5px;
    border-radius:6px; padding:14px 16px; text-align:left; margin-top:16px;
    line-height:1.8;
  }

  /* Debrief */
  .lesson-list{margin:0; padding-left:0; list-style:none;}
  .lesson-list li{
    display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);
    font-size:13.5px; line-height:1.7;
  }
  .lesson-list li:last-child{border-bottom:none;}
  .lesson-list .num{
    width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;
  }
  .score{
    text-align:center; margin-top:6px; font-size:13px; color:var(--muted);
  }

  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="stage">
  <div class="header">
    <h1>謎解き:その写真、本当に開いて大丈夫?</h1>
    <p>フィッシングメール体験デモ(教育用モックアップ・実行ファイルは一切含みません)</p>
  </div>

  <div class="steps" id="steps">
    <div class="dot active" data-i="0"></div>
    <div class="dot" data-i="1"></div>
    <div class="dot" data-i="2"></div>
    <div class="dot" data-i="3"></div>
    <div class="dot" data-i="4"></div>
  </div>

  <div class="window">
    <div class="titlebar">
      <div class="dots"><span></span><span></span><span></span></div>
      <span id="titlebarText">受信トレイ - Outlook</span>
    </div>
    <div class="panel" id="panel"><!-- injected --></div>
  </div>
</div>

<script>
const state = { score:0, answered:{q1:false,q2:false} };

function setStep(i){
  document.querySelectorAll('.dot').forEach(d=>{
    const di = Number(d.dataset.i);
    d.classList.toggle('active', di===i);
    d.classList.toggle('done', di<i);
  });
}

function render(html, title){
  document.getElementById('panel').innerHTML = html;
  document.getElementById('titlebarText').textContent = title;
}

/* ---------- Screen 0: Mail ---------- */
function screenMail(){
  setStep(0);
  render(`
    <div class="mail-head">
      <div class="mail-subject">写真をお送りします</div>
      <div class="mail-meta">本日 10:24</div>
    </div>
    <div class="mail-from">差出人: <b>取引先担当 &lt;sales-info@partner-co-jp.example&gt;</b></div>
    <div class="mail-body">
      いつもお世話になっております。<br>
      先日ご依頼のありました現場写真を添付いたします。<br>
      ご確認のほどよろしくお願いいたします。
    </div>
    <div class="attach" onclick="screenExplorer()">
      <div class="attach-icon">JPG</div>
      <div>
        <div class="attach-name">写真.jpg</div>
        <div class="attach-sub">クリックして開く</div>
      </div>
    </div>
  `, "受信トレイ - Outlook");
}

/* ---------- Screen 1: Explorer + Q1 (file size clue) ---------- */
function screenExplorer(){
  setStep(1);
  render(`
    <div class="explorer-toolbar">
      <span>ダウンロード フォルダー</span>
      <label class="ext-toggle"><input type="checkbox" disabled> ファイル名拡張子</label>
    </div>
    <div class="file-row">
      <div class="file-icon">JPG</div>
      <div class="file-info">
        <div class="file-name">写真.jpg</div>
        <div class="file-cols">
          <span>種類: JPEG イメージ</span>
          <span>サイズ: <b>2KB</b></span>
        </div>
      </div>
    </div>

    <div class="question">
      <h3>Q1. この画面を見て、最も「怪しい」と感じるべき点はどれ?</h3>
      <button class="opt" onclick="answerQ1(this,false)">アイコンが写真っぽいデザインなので特に問題ない</button>
      <button class="opt" onclick="answerQ1(this,true)">スマホやカメラで撮った写真にしては、ファイルサイズが小さすぎる(2KB)</button>
      <button class="opt" onclick="answerQ1(this,false)">差出人の名前が「取引先担当」となっている</button>
      <div id="fb1"></div>
    </div>
    <div class="btn-row"><button class="btn" id="next1" style="display:none" onclick="screenReveal()">次へ進む</button></div>
  `, "エクスプローラー");
}

function answerQ1(el, isCorrect){
  if(state.answered.q1) return;
  state.answered.q1 = true;
  document.querySelectorAll('.question .opt').forEach(o=>o.setAttribute('disabled','true'));
  if(isCorrect){
    el.classList.add('correct');
    state.score++;
    document.getElementById('fb1').innerHTML = `<div class="feedback ok">正解です。実物の写真ファイルは数百KB〜数MBあるのが普通です。2KB程度の「.jpg」は、写真ではなく別の種類のファイル(ショートカットなど)である可能性が高いサインです。</div>`;
  }else{
    el.classList.add('wrong');
    document.querySelectorAll('.question .opt').forEach(o=>{
      if(o.textContent.includes('2KB')) o.classList.add('correct');
    });
    document.getElementById('fb1').innerHTML = `<div class="feedback warn">実はファイルサイズが最大のヒントでした。実物の写真は数百KB〜数MBあるのが普通で、2KBという小ささは「写真ではない何か」が化けている可能性を示します。</div>`;
  }
  document.getElementById('next1').style.display = 'inline-block';
}

/* ---------- Screen 2: Reveal hidden extension ---------- */
function screenReveal(){
  setStep(2);
  render(`
    <div class="explorer-toolbar">
      <span>ダウンロード フォルダー</span>
      <label class="ext-toggle"><input type="checkbox" id="extBox" onclick="toggleExt()"> ファイル名拡張子</label>
    </div>
    <div class="file-row">
      <div class="file-icon">JPG</div>
      <div class="file-info">
        <div class="file-name" id="fname">写真.jpg</div>
        <div class="file-cols" id="fcols">
          <span>種類: JPEG イメージ</span>
          <span>サイズ: 2KB</span>
        </div>
      </div>
    </div>
    <div class="question">
      <h3>Windowsは既定で「よく知られた拡張子」を表示しません。上のチェックボックスを ON にして、本当のファイル名を確認してみましょう。</h3>
      <div id="fb2"></div>
    </div>
    <div class="btn-row"><button class="btn hidden" id="next2" onclick="screenProperties()">プロパティを確認する</button></div>
  `, "エクスプローラー - オプション");
}

function toggleExt(){
  document.getElementById('fname').innerHTML = '写真.jpg<span class="col-flag">.lnk</span>';
  document.getElementById('fcols').innerHTML = `<span>種類: <b style="color:var(--danger)">ショートカット (.lnk)</b></span><span>サイズ: 2KB</span>`;
  document.getElementById('fb2').innerHTML = `<div class="feedback ok">正体が見えました。「写真.jpg」に見えていたのは、実際には「写真.jpg.lnk」というショートカットファイルでした。「.lnk」は既定で表示されないため、一見ただの画像に見えてしまいます。</div>`;
  document.getElementById('next2').classList.remove('hidden');
}

/* ---------- Screen 3: Properties dialog reveal ---------- */
function screenProperties(){
  setStep(3);
  render(`
    <div class="prop-tabs">
      <div class="prop-tab">全般</div>
      <div class="prop-tab active">ショートカット</div>
      <div class="prop-tab">セキュリティ</div>
      <div class="prop-tab">詳細</div>
    </div>
    <div class="prop-row">
      <div class="prop-label">リンク先の種類</div>
      <div class="prop-value">アプリケーション</div>
    </div>
    <div class="prop-row">
      <div class="prop-label">リンク先</div>
      <div class="prop-value flagged">%windir%\\system32\\cmd.exe /c start 写真.jpg &amp; powershell -windowstyle hidden -enc &lt;難読化された文字列(ダミー)&gt;</div>
    </div>
    <div class="prop-row">
      <div class="prop-label">作業フォルダー</div>
      <div class="prop-value">(空欄)</div>
    </div>
    <div class="prop-row">
      <div class="prop-label">アイコン</div>
      <div class="prop-value">JPEGファイル用の既定アイコンを流用</div>
    </div>

    <div class="callouts">
      <div class="callout"><div class="n">1</div><div>ダブルクリックすると、実は cmd.exe や PowerShell が裏側で起動する設定になっている。「写真.jpg」という名前やアイコンは、ユーザーを油断させるための偽装にすぎない。</div></div>
      <div class="callout"><div class="n">2</div><div>「start 写真.jpg」のように、本物のダミー画像を一瞬表示して違和感をごまかす手口もよく使われる。</div></div>
      <div class="callout"><div class="n">3</div><div>コマンドが長い英数字の羅列(難読化)になっている場合、内容を隠して解析を困難にしている可能性が高い。</div></div>
    </div>

    <div class="question" style="margin-top:20px;">
      <h3>Q2. この状況で最も適切な行動はどれ?</h3>
      <button class="opt" onclick="answerQ2(this,false)">アイコンは写真に見えるので、そのままダブルクリックして開く</button>
      <button class="opt" onclick="answerQ2(this,true)">開かずに、情報システム部門・CSIRTへ連絡して確認してもらう</button>
      <button class="opt" onclick="answerQ2(this,false)">ウイルス対策ソフトの通知が出なければ安全なので開く</button>
      <div id="fb3"></div>
    </div>
    <div class="btn-row"><button class="btn hidden" id="next3" onclick="screenDebrief()">結果を見る</button></div>
  `, "写真.jpg.lnk のプロパティ");
}

function answerQ2(el, isCorrect){
  if(state.answered.q2) return;
  state.answered.q2 = true;
  document.querySelectorAll('#panel .question:last-of-type .opt').forEach(o=>o.setAttribute('disabled','true'));
  if(isCorrect){
    el.classList.add('correct');
    state.score++;
    document.getElementById('fb3').innerHTML = `<div class="feedback ok">正解です。少しでも違和感があれば、自己判断で開かずに専門部署へ確認するのが最も安全な行動です。</div>`;
  }else{
    el.classList.add('wrong');
    document.querySelectorAll('#panel .question:last-of-type .opt').forEach(o=>{
      if(o.textContent.includes('情報システム部門')) o.classList.add('correct');
    });
    document.getElementById('fb3').innerHTML = `<div class="feedback warn">見た目やアイコン、検知の有無だけでは安全性は判断できません。少しでも違和感があれば開かずに専門部署へ確認しましょう。</div>`;
  }
  document.getElementById('next3').classList.remove('hidden');
}

/* ---------- Screen 4: Debrief ---------- */
function screenDebrief(){
  setStep(4);
  render(`
    <div style="text-align:center; margin-bottom:6px; font-size:15px; font-weight:600;">謎解き完了</div>
    <div class="score">正答数: ${state.score} / 2</div>
    <ul class="lesson-list" style="margin-top:18px;">
      <li><div class="num">1</div><div>写真ファイルにしてはサイズが小さすぎる場合、写真そのものではなく別の種類のファイルが化けている可能性がある。</div></li>
      <li><div class="num">2</div><div>Windowsは既定で拡張子を隠す設定になっている。「フォルダー オプション」や「表示」タブから拡張子を常に表示する設定にしておくと、偽装に気づきやすくなる。</div></li>
      <li><div class="num">3</div><div>見慣れないファイルは、開く前に右クリック→プロパティで種類やリンク先を確認する習慣をつける。</div></li>
      <li><div class="num">4</div><div>少しでも違和感がある添付ファイルは、自己判断で開かず情報システム部門やCSIRTに確認する。</div></li>
    </ul>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn secondary" onclick="restart()">もう一度挑戦する</button>
    </div>
  `, "研修結果");
}

function restart(){
  state.score = 0;
  state.answered = {q1:false,q2:false};
  screenMail();
}

screenMail();
</script>
</body>
</html>
